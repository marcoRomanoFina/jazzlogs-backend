# --- Datasource (H2, in-memory) ---
# Local dev only. Fresh schema every restart via ddl-auto=update (see base
# application.properties) — no real Postgres connection needed. Data does NOT
# survive a restart on purpose; that's the trade for zero setup. Point at real
# data by running with SPRING_PROFILES_ACTIVE=prod and the DATABASE_* env vars
# instead (see application-prod.properties).
spring.datasource.url=jdbc:h2:mem:jazzlogs;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 console ---
# http://localhost:8080/h2-console — JDBC URL above, user sa, blank password.
spring.h2.console.enabled=true
