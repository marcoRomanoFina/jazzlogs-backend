# --- Datasource (Postgres via Supabase) ---
# Same real instance as prod (see application-prod.properties) — set the
# DATABASE_* env vars locally to point at it. H2 was tried here for a while
# (zero-setup local dev) but couldn't run the pg_trgm/pgvector SQL the agent
# tools need (ResolveJazzlogsEntityTool, EditorialSearchTool), so dev and prod
# now share the same real database instead.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# --- Flyway ---
spring.flyway.enabled=true
