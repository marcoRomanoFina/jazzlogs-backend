# --- Datasource (Postgres) ---
# Defaults to the local docker-compose stack (see docker-compose.yml, port
# 5433 not 5432 — leaves room for a native Postgres already on 5432) — set
# the DATABASE_* env vars to point at a real production Postgres instead, same
# as prod (see application-prod.properties). H2 was tried here for a while
# (zero-setup local dev) but couldn't run the pg_trgm/pgvector SQL the agent
# tools need (ResolveJazzlogsEntityTool, EditorialSearchTool), so this
# compose stack replaced it instead.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# --- Flyway ---
spring.flyway.enabled=true
