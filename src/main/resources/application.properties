spring.application.name=jazzlogs-backend

# --- Active profile ---
# dev (default) and prod both point at the same real Supabase Postgres (see
# application-dev.properties / application-prod.properties) — prod is just
# what deployment sets automatically (SPRING_PROFILES_ACTIVE=prod, e.g. Railway).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Supabase Auth JWT validation ---
# Spring never authenticates users; it only verifies JWTs issued by Supabase Auth
# using Supabase's public JWKS. No default is provided on purpose: the app should
# fail fast on boot if this isn't configured, rather than silently pointing nowhere.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
# Supabase signs with its project's asymmetric key (ES256), not RS256 — Spring Boot's
# jwk-set-uri autoconfiguration only trusts RS256 unless told otherwise.
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# --- CORS ---
# Comma-separated list of allowed origins. Add the Vercel domain here once deployed,
# e.g. https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Datasource ---
# Profile-specific (see application-dev.properties / application-prod.properties).
# ddl-auto is "none" — Flyway (see db/migration) is the only thing allowed to
# change the schema now. It used to be "update", with Flyway only owning
# extensions/non-default index types; V0 was reverse-engineered from the
# schema ddl-auto had already built, specifically so this cutover wouldn't
# lose anything.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway baseline ---
# This schema existed for the whole project's life before Flyway was
# introduced — baselineVersion=0 (not the default of 1) so V1 and V2 both
# actually run instead of V1 being treated as already-applied at baseline.
# V0 (full schema) and V3+ (schema changes) are NOT safe to run twice; V1/V2
# still are (CREATE ... IF NOT EXISTS). On the real database, V0 is always
# skipped (version 0 <= baseline 0) since the schema it recreates already
# exists there — it only runs against a genuinely fresh, empty database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- Neo4j ---
# Local (default): Community Edition in Docker via bolt://.
# Production (Railway): set NEO4J_URI to the Aura connection string
# (neo4j+s://<instance>.databases.neo4j.io) as an env var — the driver
# picks encryption/routing off the URI scheme itself, no code change needed.
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
# Short on purpose: in prod (Aura) this is a real network hop, and these bound
# how long a request-adjacent call can hang before the async path (see
# Neo4jAsyncSyncExecutor) or the retry worker gives up on a single attempt.
spring.neo4j.connection-timeout=${NEO4J_CONNECTION_TIMEOUT:5s}
spring.neo4j.pool.connection-acquisition-timeout=${NEO4J_CONNECTION_ACQUISITION_TIMEOUT:5s}

# --- Spotify (client credentials, app-only) ---
# Optional: only used when a request supplies a spotifyAlbumId. Empty default
# so the app still boots without it; SpotifyAuthService fails loudly (but only
# when actually invoked) if these are blank.
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

# --- OpenAI (editorial block embeddings) ---
# Optional at boot (empty default) — only used by POST /albums/{id}/editorial and
# POST /tracks/{id}/editorial. OpenAiEmbeddingService fails loudly the moment those
# endpoints are actually hit without a key configured.
openai.api-key=${OPENAI_API_KEY:}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding-dimensions=${OPENAI_EMBEDDING_DIMENSIONS:1536}

# --- Agent (Responses API) ---
# Model name only — reasoning.effort=low / reasoning.context=all_turns are
# fixed architecture decisions, not configurable (see OpenAiResponsesStreamClient).
agent.model.name=${AGENT_MODEL_NAME:gpt-5.6-luna}
agent.max-iterations=${AGENT_MAX_ITERATIONS:6}
agent.max-tool-calls-per-turn=${AGENT_MAX_TOOL_CALLS_PER_TURN:4}

# --- Neo4j sync failure retry (SyncRetryWorker) ---
sync-failure.retry-interval-ms=${SYNC_FAILURE_RETRY_INTERVAL_MS:300000}
sync-failure.max-attempts=${SYNC_FAILURE_MAX_ATTEMPTS:5}

# --- Neo4j sync failure cleanup (SyncFailureCleanupJob) ---
# Only touches RESOLVED rows, once a day by default; DEAD rows are left for manual review.
sync-failure.cleanup.interval-ms=${SYNC_FAILURE_CLEANUP_INTERVAL_MS:86400000}
sync-failure.cleanup.retention-days=${SYNC_FAILURE_CLEANUP_RETENTION_DAYS:30}
