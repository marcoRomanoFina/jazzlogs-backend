# --- Datasource (Postgres via Supabase) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# --- Flyway ---
# Explicit even though true is the default once flyway-core is on the
# classpath. Runs db/migration on boot — the entire schema (see
# db/migration/V0), not just pg_trgm/pgvector extras, now that ddl-auto is off.
spring.flyway.enabled=true
