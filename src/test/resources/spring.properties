# Read by org.springframework.core.SpringProperties, not by Boot's normal
# Environment — spring.test.context.cache.maxSize has to live here (or as a
# JVM system property) because the test ApplicationContext cache is a
# static, JVM-wide singleton initialized before any @SpringBootTest context
# (and therefore its application.properties) is even loaded.
#
# Default is 32. This suite has ~14 distinct context configurations today
# (each @MockitoBean combo is its own context) — 16 gives every one of them
# room to stay cached (and its HikariCP pool to stay open) for the whole
# run without getting evicted and re-created, which used to cause real
# context-churn flakiness (a background thread from a torn-down context's
# executor still running when the next context spun up). Not left at the
# framework's own default (32): still bounded, so a future growth in
# distinct configurations degrades gracefully (some churn) instead of
# silently ballooning connections against whatever Postgres is targeted —
# see maximum-pool-size in application.properties for the other half of
# that bound.
spring.test.context.cache.maxSize=16
