# Read by org.springframework.core.SpringProperties, not by Boot's normal
# Environment — spring.test.context.cache.maxSize has to live here (or as a
# JVM system property) because the test ApplicationContext cache is a
# static, JVM-wide singleton initialized before any @SpringBootTest context
# (and therefore its application.properties) is even loaded.
#
# Default is 32, which lets every one of this suite's ~10 distinct context
# configurations (each @MockitoBean combo is its own context) stay cached —
# and therefore each one's own HikariCP connection pool stay open — for the
# whole test run at once. Capping this forces older contexts (and their
# pools) to close as new ones are created, keeping total connections against
# the shared Supabase instance's 15-connection session-mode pool bounded
# regardless of how many distinct context configurations the suite grows to.
spring.test.context.cache.maxSize=2
