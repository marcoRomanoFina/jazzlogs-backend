# Test-only overrides so the app context boots without live infrastructure.
# Real environments must set SUPABASE_JWKS_URI (Supabase Auth JWKS — auth
# only, not Postgres), DATABASE_URL, etc. themselves.
# "test" profile disables VocabularySeeder (see @Profile("!test")) so tests
# never need a live Neo4j instance.
spring.profiles.active=test

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/.well-known/jwks.json
app.cors.allowed-origins=http://localhost:3000

# Same default as dev/prod — the local docker-compose stack (port 5433, see
# application-dev.properties) unless DATABASE_* env vars point elsewhere
# (e.g. a real production Postgres, or CI's ephemeral service container —
# see .github/workflows/test.yml). Was H2 in-memory; couldn't run the
# pg_trgm/pgvector SQL the agent tools need.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none

# HikariCP's default max pool size (10) is fine for one running app, but
# spring.properties now keeps up to 16 distinct @SpringBootTest contexts
# cached at once (each its own connection pool, holding minimumIdle
# connections open at rest — equal to maximumPoolSize unless set
# separately) — at the framework default that's up to 160 connections
# against a Postgres whose default max_connections is 100. 4 keeps 16
# contexts comfortably under that with headroom to spare, while still
# safely above 1 (too low — a @Scheduled job, SyncRetryWorker/
# SyncFailureCleanupJob, can hold the pool's one connection on its own
# thread while Flyway's bean creation blocks waiting for a connection too,
# deadlocking until HikariCP's own timeout).
spring.datasource.hikari.maximum-pool-size=4

# This file replaces (not merges with) src/main/resources/application.properties
# on the test classpath, so the baseline settings there don't apply here —
# see its comment for why baseline-version=0 matters.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# The container's real password, not a placeholder — Spring Boot's Neo4j
# autoconfiguration still creates a real Driver bean per context regardless
# of GraphService being mocked, and a wrong password here makes every one of
# them fail to authenticate. With this many distinct test contexts booting
# in one run, enough failed attempts trip Neo4j's own brute-force lockout
# (AuthenticationRateLimit), which then takes down every context booted
# afterward, not just the one that tripped it. PlaylistTrackSyncFailureTest
# needs Neo4j to genuinely be unreachable for its own tests — it overrides
# spring.neo4j.uri to an unreachable port instead of relying on a bad
# password, so it gets a connection failure (not an auth failure) and never
# touches this lockout.
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD:jazzlogs-dev-password}

# Same defaults as main's application.properties — the local docker-compose
# MinIO. ImageStorageServiceTest hits it for real; every other test mocks
# ImageStorageService, but the S3Client bean still gets created either way.
image-storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
image-storage.region=${MINIO_REGION:us-east-1}
image-storage.access-key=${MINIO_ROOT_USER:minioadmin}
image-storage.secret-key=${MINIO_ROOT_PASSWORD:jazzlogs-dev-password}
image-storage.bucket=${MINIO_BUCKET:jazzlogs-images}
image-storage.public-url-base=${MINIO_PUBLIC_URL_BASE:http://localhost:9000/jazzlogs-images}

# Small cap for tests, same reasoning as prod: reject oversized uploads
# early rather than buffering them.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
