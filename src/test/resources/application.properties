# Test-only overrides so the app context boots without live infrastructure.
# Real environments must set SUPABASE_JWKS_URI, DATABASE_URL, etc. themselves.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/.well-known/jwks.json
app.cors.allowed-origins=http://localhost:3000

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
